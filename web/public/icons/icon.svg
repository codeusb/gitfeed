<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer RSS Arch -->
  <path d="M 128 384 A 256 256 0 0 1 384 384" fill="none" stroke="url(#signalGrad)" stroke-width="36" stroke-linecap="round" />
  
  <!-- Middle RSS Arch -->
  <path d="M 128 384 A 176 176 0 0 1 304 384" fill="none" stroke="url(#signalGrad)" stroke-width="32" stroke-linecap="round" opacity="0.9" />

  <!-- Center Dot -->
  <circle cx="140" cy="372" r="32" fill="#f97316" />

  <!-- Git Branch Node Overlay -->
  <g transform="translate(240, 140)">
    <circle cx="80" cy="40" r="22" fill="#10b981" />
    <circle cx="160" cy="40" r="18" fill="#3b82f6" />
    <circle cx="120" cy="110" r="18" fill="#6366f1" />
    <path d="M 80 40 L 160 40 M 80 40 Q 100 110 120 110" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
