<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GitFeed" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <title>GitFeed - Git-as-Backend RSS Reader</title>
    <script>
      // Initialize theme early to avoid flicker
      try {
        const savedTheme = localStorage.getItem('gitfeed_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-orange-500/20 selection:text-orange-500">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
